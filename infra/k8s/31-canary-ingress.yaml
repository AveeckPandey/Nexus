apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexus-ingress-canary
  namespace: nexus
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "10"
spec:
  rules:
    - host: nexus.yourdomain.com
      http:
        paths:
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: nexus-server-canary
                port:
                  number: 8080
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: nexus-server-canary
                port:
                  number: 8080
