# Maps to the AWS IAM role via IRSA — pods get DynamoDB/S3/Translate
# permissions with no static keys. Replace the annotation with the
# `nexus_server_irsa_role_arn` terraform output after apply.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nexus-server-sa
  namespace: nexus
  annotations:
    eks.amazonaws.com/role-arn: REPLACE_WITH_TERRAFORM_OUTPUT_nexus_server_irsa_role_arn
