# Secret template — fill every REPLACE_ME from `terraform output`
# (cognito_client_secret and the redis secret are sensitive outputs) plus
# your own generated values, then `kubectl apply -f 03-secrets.yaml`.
# NEVER commit real values. Alternative without a file on disk:
#   kubectl -n nexus create secret generic nexus-server-secret \
#     --from-literal=SESSION_JWT_SECRET='...' --from-literal=... \
#     --dry-run=client -o yaml | kubectl apply -f -
# Generate SESSION_JWT_SECRET with: openssl rand -hex 32  (min 32 chars).
apiVersion: v1
kind: Secret
metadata:
  name: nexus-server-secret
  namespace: nexus
type: Opaque
stringData:
  SESSION_JWT_SECRET: "REPLACE_ME_min_32_chars_random_hex"
  GOOGLE_CLIENT_ID: "REPLACE_ME_google_oauth_client_id"
  COGNITO_USER_POOL_ID: "REPLACE_ME_terraform_output_cognito_user_pool_id"
  COGNITO_CLIENT_ID: "REPLACE_ME_terraform_output_cognito_client_id"
  COGNITO_CLIENT_SECRET: "REPLACE_ME_terraform_output_cognito_client_secret"
  GROQ_API_KEY: "REPLACE_ME_groq_api_key"
  VAPID_PUBLIC_KEY: "REPLACE_ME_vapid_public_key"
  VAPID_PRIVATE_KEY: "REPLACE_ME_vapid_private_key"
  REDIS_URL: "REPLACE_ME_terraform_redis_secret_reddis_url"
