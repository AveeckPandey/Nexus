# TURN relay for strict symmetric NATs (~15-20% enterprise/mobile).
# WebRTC media stays P2P via STUN by default; clients fall back to this
# relay only when direct paths fail (see web/lib/webrtc.ts getIceServers
# reading NEXT_PUBLIC_TURN_URL). Deploys coturn; credentials come from
# the nexus-turn-secret below — never commit real values.
# Apply: kubectl apply -f 32-turn.yaml
apiVersion: v1
kind: Secret
metadata:
  name: nexus-turn-secret
  namespace: nexus
type: Opaque
stringData:
  TURN_USERNAME: "REPLACE_ME_turn_username"
  TURN_CREDENTIAL: "REPLACE_ME_turn_credential"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-turn
  namespace: nexus
  labels:
    app: nexus-turn
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexus-turn
  template:
    metadata:
      labels:
        app: nexus-turn
    spec:
      containers:
        - name: coturn
          image: coturn/coturn:4.6.2
          args:
            - "-n"
            - "--realm=nexus.app"
            - "--use-auth-secret"
            - "--static-auth-secret=$(TURN_CREDENTIAL)"
            - "--user=$(TURN_USERNAME):$(TURN_CREDENTIAL)"
          env:
            - name: TURN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: nexus-turn-secret
                  key: TURN_USERNAME
            - name: TURN_CREDENTIAL
              valueFrom:
                secretKeyRef:
                  name: nexus-turn-secret
                  key: TURN_CREDENTIAL
          ports:
            - name: turn
              containerPort: 3478
              protocol: UDP
            - name: turn-tcp
              containerPort: 3478
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-turn-service
  namespace: nexus
spec:
  type: LoadBalancer
  selector:
    app: nexus-turn
  ports:
    - name: turn-udp
      port: 3478
      targetPort: 3478
      protocol: UDP
    - name: turn-tcp
      port: 3478
      targetPort: 3478
      protocol: TCP
