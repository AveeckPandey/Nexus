apiVersion: v1
kind: ConfigMap
metadata:
  name: coturn-config
  namespace: nexus
data:
  turnserver.conf: |
    listening-port=3478
    tls-listening-port=5349
    min-port=49152
    max-port=49200
    realm=nexus.yourdomain.com
    use-auth-secret
    static-auth-secret=nexus_turn_secret_token_change_in_prod
    total-quota=100
    max-bps=3000000
    bps-capacity=0
    no-loopback-peers
    no-multicast-peers
    no-stdout-log
    log-file=/var/log/turn.log
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-coturn
  namespace: nexus
  labels:
    app: nexus-coturn
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexus-coturn
  template:
    metadata:
      labels:
        app: nexus-coturn
    spec:
      containers:
        - name: coturn
          image: coturn/coturn:latest
          args: ["-c", "/etc/coturn/turnserver.conf"]
          ports:
            - name: turn-udp
              containerPort: 3478
              protocol: UDP
            - name: turn-tcp
              containerPort: 3478
              protocol: TCP
            - name: turns-tcp
              containerPort: 5349
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/coturn/turnserver.conf
              subPath: turnserver.conf
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      volumes:
        - name: config
          configMap:
            name: coturn-config
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-coturn-service
  namespace: nexus
spec:
  type: LoadBalancer
  selector:
    app: nexus-coturn
  ports:
    - name: turn-udp
      port: 3478
      targetPort: 3478
      protocol: UDP
    - name: turn-tcp
      port: 3478
      targetPort: 3478
      protocol: TCP
    - name: turns-tcp
      port: 5349
      targetPort: 5349
      protocol: TCP
